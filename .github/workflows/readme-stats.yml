name: generate readme stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=Imrozdotpi&show_icons=true&theme=tokyonight&hide_border=false"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=Imrozdotpi&layout=compact&theme=tokyonight&hide_border=false"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=Imrozdotpi&repo=npl-docseal&theme=tokyonight&hide_border=false"
          path: profile/pin-npl-docseal.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=Imrozdotpi&repo=RAG-chatbot&theme=tokyonight&hide_border=false"
          path: profile/pin-rag-chatbot.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: "username=Imrozdotpi&repo=Decision-Labeler&theme=tokyonight&hide_border=false"
          path: profile/pin-decision-labeler.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=Imrozdotpi&theme=tokyonight&hide_border=false"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "update readme stats" || exit 0
          git push
